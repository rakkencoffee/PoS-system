<script>
        // Simple Interaction logic for category selection
        const categoryButtons = document.querySelectorAll('.category-scroll button');
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'active-pill');
                    b.classList.add('bg-surface', 'border', 'border-surface-variant', 'text-taupe');
                });
                btn.classList.add('bg-primary', 'text-on-primary', 'active-pill');
                btn.classList.remove('bg-surface', 'border', 'border-surface-variant', 'text-taupe');
            });
        });

        // FAB scale on scroll
        let lastScroll = 0;
        const cartFab = document.getElementById('cart-fab');
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                cartFab.classList.add('scale-75', 'opacity-80');
            } else {
                cartFab.classList.remove('scale-75', 'opacity-80');
            }
            lastScroll = currentScroll;
        });
    </script>
