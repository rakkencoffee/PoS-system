<style>
        body {
            background-color: #FFFFFF;
            overflow: hidden;
        }
        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-soft {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .btn-active:active {
            transform: scale(0.97);
            transition: transform 0.15s ease-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-[844px] w-[390px] mx-auto overflow-hidden bg-surface relative">
<!-- Decorative Background Element (Tactile Minimalism) -->
<div class="absolute inset-0 pointer-events-none opacity-5">
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-container rounded-full blur-3xl"></div>
<div class="absolute bottom-[20%] left-[-20%] w-80 h-80 bg-surface-variant rounded-full blur-3xl"></div>
</div>
<!-- Top Spacer for visual balance -->
<div class="h-hero"></div>
<!-- Brand Center Section -->
<div class="flex flex-col items-center justify-center flex-grow fade-in">
<div class="mb-section-sep">
<div class="w-24 h-24 bg-primary rounded-xl flex items-center justify-center shadow-lg relative overflow-hidden pulse-soft">
<!-- Brand Mark Symbol -->
<span class="material-symbols-outlined text-on-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">coffee</span>
<!-- Subtle Texture Layer -->
<div class="absolute inset-0 bg-white/5 pointer-events-none"></div>
</div>
</div>
<div class="text-center space-y-standard px-page-gutter">
<h1 class="font-display text-primary text-h1-mobile tracking-tight">RAKKEN COFFEE</h1>
<p class="font-h3 text-h3 text-on-surface-variant tracking-normal">Selamat Datang</p>
<div class="w-12 h-[1px] bg-taupe/30 mx-auto mt-standard"></div>
</div>
<!-- Ambient Product Image (Minimalist Card) -->
<div class="mt-hero px-page-gutter w-full">
<div class="bg-surface border border-surface-container shadow-sm rounded-xl overflow-hidden aspect-[4/3] relative">
<img alt="Premium minimalist coffee" class="w-full h-full object-cover" data-alt="A high-end, minimalist close-up of a single ceramic espresso cup sitting on a polished white marble surface. The lighting is soft, airy, and high-key, highlighting the rich dark crema of the coffee against the pristine white background. The composition is clean and sophisticated, reflecting a premium boutique cafe aesthetic with a focus on tactile luxury and effortless precision." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHsdGrviFwreKB5ioXbRGlwi0EqRKmdqEPQBz4i4Uvk51GMctZ7koTaUcU5_Ct3nVsvTOEkD7nEYyUNa9COAlWdsu-SctKAiF4_mIa0TLc-10INAAvQnllQkbzFUtAutgdWHgxeZU5R1u5PJazNEime7_7tghUvkW6CRc_OF5Eo7id9Qbkd7kCmJq03z4Hnm9JKHHYpbtPpOr4UlrUREvYYPfTKZ7mAnhMyP8S759pQbqAR4g_QzrwxGJGzHX__IQWqlc7GZaQ8LI">
<div class="absolute inset-0 bg-gradient-to-t from-white/20 to-transparent"></div>
</div>
</div>
</div>
<!-- Bottom Action Section -->
<div class="w-full px-page-gutter pb-[64px] fade-in" style="animation-delay: 0.3s;">
<div class="flex flex-col gap-standard">
<!-- Primary Red Button -->
<button class="w-full bg-primary text-on-primary font-h4 text-h4 py-standard rounded-full shadow-md btn-active flex items-center justify-center gap-compact" onclick="handleStart()">
<span>Mulai Pesan</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Secondary/Ghost Action -->
<button class="w-full py-compact text-taupe font-tag text-tag hover:text-primary transition-colors duration-200">
                Lihat Menu Musiman
            </button>
</div>
</div>
<!-- Language / Status Pill -->
<div class="absolute top-standard right-standard">
<div class="flex items-center gap-compact bg-off-white px-standard py-tight rounded-full border border-surface-container">
<div class="w-2 h-2 bg-primary rounded-full animate-pulse"></div>
<span class="font-tag text-tag text-on-surface-variant">ID | EN</span>
</div>
</div>
<script>
        function handleStart() {
            // Micro-interaction for feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            
            // Simulation of navigation transition
            setTimeout(() => {
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease-out';
            }, 300);
        }

        // Simple parallax-like entrance for the product card
        window.addEventListener('load', () => {
            const card = document.querySelector('.mt-hero');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 600);
        });
    </script>
</body></html>
