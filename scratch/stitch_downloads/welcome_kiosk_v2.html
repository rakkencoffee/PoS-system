<!DOCTYPE html><html class="light" lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap" rel="stylesheet">
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .kiosk-container {
      width: 1024px;
      height: 768px;
      overflow: hidden;
    }
    .pulse-effect {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .7; }
    }
    .button-press:active {
      transform: scale(0.97);
    }
  </style>

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-container": "#9f131e",

            "surface-container-highest": "#f3e0be",
            "red-light": "#F5E6E8",
            "primary": "#78000f",
            "on-primary-fixed-variant": "#920416",
            "tertiary-fixed-dim": "#ddc1b4",
            "outline": "#8e706e",
            "on-tertiary-container": "#d9bcb0",

            "tertiary": "#47342c",

          "borderRadius": {

<body class="bg-background flex items-center justify-center min-h-screen p-0 m-0">
<!-- Main Kiosk Landscape Container -->
<main class="kiosk-container bg-background relative flex flex-col items-center justify-center shadow-2xl border border-surface-container-highest">
<!-- Top Bar Component (Simplified for Welcome) -->
<header class="absolute top-0 left-0 w-full px-page-gutter py-section-item flex justify-between items-center bg-transparent">
<div class="flex items-center gap-standard">
<div class="w-2 h-2 bg-primary rounded-full pulse-effect"></div>
<span class="font-tag text-tag text-taupe tracking-widest uppercase">System Online</span>
</div>
<div class="flex items-center gap-standard text-taupe">
<span class="font-tag text-tag" id="current-time">02:24 PM</span>
</div>
</header>
<!-- Center Brand Area -->
<section class="flex flex-col items-center text-center px-hero">
<!-- Logo Identity -->
<div class="mb-section-sep flex flex-col items-center">
<div class="w-24 h-24 bg-primary flex items-center justify-center rounded-xl shadow-lg mb-standard transition-transform duration-500 hover:rotate-12">
<span class="material-symbols-outlined text-[48px] text-on-primary">coffee</span>
</div>
<h2 class="font-display text-display text-primary tracking-tighter">
          RAKKEN COFFEE
        </h2>
</div>
<!-- Welcome Messaging -->
<div class="mb-hero space-y-tight">
<h1 class="font-h1 text-h1 text-near-black">
          Selamat Datang
        </h1>
<p class="font-body-lg text-body-lg text-taupe max-w-[500px]">
          Nikmati kemudahan memesan kopi favorit Anda melalui langkah digital yang sederhana.
        </p>
</div>
<!-- Massive Primary Action -->
<button class="group relative button-press transition-all duration-300 ease-in-out">
<!-- Decoration Ring -->
<div class="absolute inset-0 bg-primary/20 rounded-full scale-110 blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
<!-- Main Button Surface -->
<div class="relative bg-primary text-on-primary px-hero py-section-item rounded-full flex items-center gap-standard shadow-lg">
<span class="font-h2 text-h2 px-standard">Mulai Pesan</span>
<div class="bg-primary-container rounded-full p-tight flex items-center justify-center group-hover:translate-x-1 transition-transform">
<span class="material-symbols-outlined text-[32px]">arrow_forward</span>
</div>
</div>
</button>
</section>
<!-- Bottom Footer Hints -->
<footer class="absolute bottom-0 left-0 w-full px-page-gutter py-section-item flex justify-center bg-transparent">
<div class="flex items-center gap-standard text-taupe/60">
<span class="material-symbols-outlined text-standard">touch_app</span>
<span class="font-caption text-caption">Sentuh layar untuk memulai pesanan baru</span>
</div>
</footer>
<!-- Atmosphere Decoration (Corner Accents) -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-surface-container rounded-full opacity-50 blur-3xl"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
</main>
<script>
    // Lightweight micro-interactions and UI logic
    
    // Update time
    function updateTime() {
      const timeElement = document.getElementById('current-time');
      const now = new Date();
      timeElement.textContent = now.toLocaleTimeString('en-US', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: true 
      });
    }
    
    setInterval(updateTime, 1000);
    updateTime();

    // Haptic visual feedback simulation
    const mainButton = document.querySelector('button');
    mainButton.addEventListener('click', () => {
      // Logic for transition to menu would go here
      console.log('Starting order flow...');
      
      // Visual feedback transition
      mainButton.style.transform = 'scale(0.95)';
      setTimeout(() => {
        mainButton.style.transform = 'scale(1)';
      }, 150);
    });

    // Screen saver idle logic placeholder
    let idleTime = 0;
    const resetIdle = () => idleTime = 0;
    window.onload = resetIdle;
    window.onmousemove = resetIdle;
    window.onmousedown = resetIdle;
    window.ontouchstart = resetIdle;
    window.onclick = resetIdle;
    window.onkeypress = resetIdle;

    setInterval(() => {
      idleTime++;
      if (idleTime > 60) { // 60 seconds of inactivity
        // Reset to initial welcome state or show attract loop
      }
    }, 1000);
  </script>
</body></html>
