<!-- UI Interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple Selection Logic Toggle (UI Only)
            const optionButtons = document.querySelectorAll('section:not(:last-of-type) button');
            
            optionButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const parent = this.closest('div');
                    const siblings = parent.querySelectorAll('button');
                    
                    siblings.forEach(s => {
                        s.classList.remove('bg-primary', 'active-red-shadow', 'border-primary', 'text-white');
                        s.classList.add('bg-white', 'border-border-subtle', 'text-on-surface-variant');
                        const statusLabel = s.querySelector('span:last-child');
                        if (statusLabel && statusLabel.innerText === 'BASE') statusLabel.classList.add('opacity-60');
                    });
                    
                    this.classList.remove('bg-white', 'border-border-subtle', 'text-on-surface-variant');
                    this.classList.add('bg-primary', 'active-red-shadow', 'border-primary', 'text-white');
                    const statusLabel = this.querySelector('span:last-child');
                    if (statusLabel) statusLabel.classList.remove('opacity-60');
                });
            });

            // Quantity Counter Logic
            const counterLabel = document.querySelector('.tabular-nums');
            const minusBtn = counterLabel.previousElementSibling;
            const plusBtn = counterLabel.nextElementSibling;
            let count = 1;

            minusBtn.addEventListener('click', () => {
                if (count > 1) {
                    count--;
                    counterLabel.innerText = count;
                }
            });

            plusBtn.addEventListener('click', () => {
                count++;
                counterLabel.innerText = count;
            });
        });
    </script>
